<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat | OpenG2P UCA</title>
    <link rel="icon" href="${PATH_PREFIX}static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="${PATH_PREFIX}static/main.css">
    <link rel="stylesheet" href="${PATH_PREFIX}static/Roboto.css">
    <script src="https://cdn.jsdelivr.net/npm/showdown/dist/showdown.min.js"></script>
    <script type="text/javascript" src="${PATH_PREFIX}js/common.js"></script>
    <script type="text/javascript" src="${PATH_PREFIX}js/chat.js"></script>
</head>
<body>
    <header>
        <div class="logo-container">
            <button id="navToggleBtn" class="nav-toggle-btn">☰</button>
            <img src="${PATH_PREFIX}static/logo.png" alt="Logo" class="logo">
            <span>OpenG2P UCA</span>
        </div>
        <div class="user-dropdown">
            <button id="userDropdownBtn" class="dropdown-btn">
                <div class="avatar" id="userAvatar"></div>
                <span id="userDisplayName"></span>
                <span>▼</span>
            </button>
            <div id="userDropdownContent" class="dropdown-content">
                <table id="userDropdownInfo" class="user-info"></table>
                <a id="logoutButton" href="#" class="user-logout danger">Logout</a>
            </div>
        </div>
    </header>
    <nav id="sidebar" class="sidebar collapsed">
        <ul id="navMenu" class="nav-menu">
            <li id="newChatButton" class="nav-link"><span class="nav-icon">➕</span><span class="nav-text">New Chat</span></li>
        </ul>
    </nav>
    <main id="main">
        <div class="chat-container">
            <div id="messagesContainer" class="messages-container"></div>
            <div class="input-container">
                <input type="text" id="messageInput" class="message-input" placeholder="Type your message..." autofocus>
                <button id="sendButton" class="send-btn">Send</button>
            </div>
        </div>
    </main>
</body>
</html>
