#user  nobody;
#worker_processes 1;

# Enables the use of JIT for regular expressions to speed-up their processing.
pcre_jit on;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

pid        /var/run/openresty/openg2p/nginx.pid;

events {
    worker_connections  1024;
}


http {
    include       /usr/local/openresty/nginx/conf/mime.types;
    default_type  application/octet-stream;

    # See Move default writable paths to a dedicated directory (#119)
    # https://github.com/openresty/docker-openresty/issues/119
    client_body_temp_path /var/run/openresty/openg2p/nginx-client-body;
    proxy_temp_path       /var/run/openresty/openg2p/nginx-proxy;
    fastcgi_temp_path     /var/run/openresty/openg2p/nginx-fastcgi;
    uwsgi_temp_path       /var/run/openresty/openg2p/nginx-uwsgi;
    scgi_temp_path        /var/run/openresty/openg2p/nginx-scgi;

    sendfile        on;
    tcp_nopush on;
    types_hash_max_size 2048;
    client_max_body_size 50m;

    keepalive_timeout  65;

    gzip on;

    # gzip_vary on;
    # gzip_proxied any;
    # gzip_comp_level 6;
    # gzip_buffers 16 8k;
    # gzip_http_version 1.1;
    # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Don't reveal OpenResty version to clients.
    server_tokens off;

    server {
        listen ${NGINX_PORT} default_server;

        root /var/run/openresty/openg2p/html;
        autoindex off;

        error_page 404 ${PATH_PREFIX}404.html;
        error_page 500 502 503 504 ${PATH_PREFIX}50x.html;

        location ${PATH_PREFIX}static {
        }
        location ${PATH_PREFIX}js {
        }
        location ${PATH_PREFIX} {
            try_files ${dollar}uri.html =404;
        }
        location = ${PATH_PREFIX}404.html {
            internal;
        }
        location = ${PATH_PREFIX}50x.html {
            internal;
        }
        location ${API_PATH_PREFIX_NGINX} {
            proxy_pass                      ${API_BACKEND_URL};
            proxy_buffering	                on;
            proxy_buffers                   8 16k;
            proxy_buffer_size               16k;
            proxy_busy_buffers_size         32k;
            proxy_pass_request_headers      on;
        }
    }
}
